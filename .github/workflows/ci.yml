name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DSSAT_TAG: v4.8.6.4
  AQUACROP_TAG: v7.3_typofix

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - run: pytest -q

  dssat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache DSSAT build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/dssat
          key: dssat-${{ env.DSSAT_TAG }}-${{ runner.os }}
      - name: Build DSSAT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran cmake
          git clone --depth 1 --branch "$DSSAT_TAG" https://github.com/DSSAT/dssat-csm-os.git ~/dssat
          cmake -S ~/dssat -B ~/dssat/build -DCMAKE_BUILD_TYPE=RELEASE
          cmake --build ~/dssat/build -j 4
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - name: Tests with DSSAT
        env:
          CROPEMU_DSSAT_EXE: /home/runner/dssat/build/bin/dscsm048
          CROPEMU_DSSAT_HOME: /home/runner/dssat/Data
        run: pytest -q

  aquacrop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the official AquaCrop executable
        run: |
          curl -sL -o ac.zip "https://github.com/KUL-RSDA/AquaCrop/releases/download/${AQUACROP_TAG}/aquacrop-7.3-x86_64-linux.zip"
          unzip -q ac.zip -d ~/aquacrop
          chmod +x ~/aquacrop/*/aquacrop
          echo "CROPEMU_AQUACROP_EXE=$(ls ~/aquacrop/*/aquacrop)" >> "$GITHUB_ENV"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - name: Tests with AquaCrop
        run: pytest -q -m aquacrop
