name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DSSAT_TAG: v4.8.6.4
  AQUACROP_TAG: v7.3_typofix

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - run: pytest -q

  dssat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache DSSAT build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/dssat
          key: dssat-${{ env.DSSAT_TAG }}-${{ runner.os }}
      - name: Build DSSAT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran cmake
          git clone --depth 1 --branch "$DSSAT_TAG" https://github.com/DSSAT/dssat-csm-os.git ~/dssat
          cmake -S ~/dssat -B ~/dssat/build -DCMAKE_BUILD_TYPE=RELEASE
          cmake --build ~/dssat/build -j 4
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - name: Tests with DSSAT
        env:
          CROPEMU_DSSAT_EXE: /home/runner/dssat/build/bin/dscsm048
          CROPEMU_DSSAT_HOME: /home/runner/dssat/Data
        run: pytest -q

  aquacrop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The released Linux executable stops with "Illegal instruction" on some runner CPUs, so
      # AquaCrop is compiled from the official source of the same tag for generic x86-64
      # (STATIC=1 of its Makefile: -O2 -mtune=generic, static) and cached until the tag changes.
      - name: Cache the AquaCrop executable
        id: aquacrop-cache
        uses: actions/cache@v4
        with:
          path: ~/aquacrop-bin
          key: aquacrop-${{ env.AQUACROP_TAG }}-${{ runner.os }}-generic-static-simul
      - name: Build AquaCrop from the official source
        if: steps.aquacrop-cache.outputs.cache-hit != 'true'
        run: |
          command -v gfortran || { sudo apt-get update -q && sudo apt-get install -y -q gfortran; }
          curl -sL "https://github.com/KUL-RSDA/AquaCrop/archive/refs/tags/${AQUACROP_TAG}.tar.gz" | tar xz
          make -C AquaCrop-*/src bin STATIC=1
          mkdir -p ~/aquacrop-bin && cp AquaCrop-*/src/aquacrop ~/aquacrop-bin/
          cp -r AquaCrop-*/testcase/SIMUL ~/aquacrop-bin/          # MaunaLoa.CO2 and default files, as in the release zip
      - run: echo "CROPEMU_AQUACROP_EXE=$HOME/aquacrop-bin/aquacrop" >> "$GITHUB_ENV"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "packages/cropemu[soil,test]" -e "packages/cropemu-bench[test]"
      - name: Tests with AquaCrop
        run: pytest -q -m aquacrop
