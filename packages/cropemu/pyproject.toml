[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cropemu"
version = "0.3.0"
description = "Fast, validated emulators of process-based crop models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fabrício Correia de Oliveira" }]
dependencies = [
    "numpy>=1.24",
    # the last onnxruntime wheels for Intel Macs are built against numpy 1
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas>=2.0",
    "onnxruntime>=1.16",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
soil = ["rasterio>=1.3"]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/cropemu"]
