[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cropemu"
version = "0.3.1"
description = "Validated neural-network emulators of DSSAT and AquaCrop: crop model seasons in microseconds, anywhere, with your own data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fabrício Correia de Oliveira" }]
keywords = ["crop model", "emulator", "surrogate model", "DSSAT", "AquaCrop", "soybean", "agriculture",
            "climate change", "yield", "machine learning", "ONNX", "NASA POWER", "SoilGrids"]
dependencies = [
    "numpy>=1.24",
    # the last onnxruntime wheels for Intel Macs are built against numpy 1
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas>=2.0",
    "onnxruntime>=1.16",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.urls]
Homepage = "https://github.com/fcoliveira-utfpr/emulator_crop"
Repository = "https://github.com/fcoliveira-utfpr/emulator_crop"
Examples = "https://github.com/fcoliveira-utfpr/emulator_crop/tree/main/examples"
Issues = "https://github.com/fcoliveira-utfpr/emulator_crop/issues"

[project.optional-dependencies]
soil = ["rasterio>=1.3"]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/cropemu"]
